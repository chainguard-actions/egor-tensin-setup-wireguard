name: Test WireGuard with preshared key and keepalive
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Generate keys
        id: keys
        run: |
          echo "private=$(openssl rand -base64 32)" >> "$GITHUB_OUTPUT"
          echo "public=$(openssl rand -base64 32)" >> "$GITHUB_OUTPUT"
          echo "psk=$(openssl rand -base64 32)" >> "$GITHUB_OUTPUT"
      - id: action
        uses: .
        continue-on-error: true
        with:
          endpoint: 127.0.0.1:51821
          endpoint_public_key: ${{ steps.keys.outputs.public }}
          ips: 10.210.0.2/24
          allowed_ips: 10.210.0.0/24
          private_key: ${{ steps.keys.outputs.private }}
          preshared_key: ${{ steps.keys.outputs.psk }}
          keepalive: "25"
      - name: Assert key files were cleaned up
        run: |
          for f in /etc/wireguard/private.key /etc/wireguard/preshared.key; do
            if sudo test -e "$f"; then
              echo "FAIL: $f still exists"
              exit 1
            fi
          done
          echo "PASS: key files cleaned up"
      - name: Assert interface configuration
        env:
          OUTCOME: ${{ steps.action.outcome }}
          PUB: ${{ steps.keys.outputs.public }}
          PSK: ${{ steps.keys.outputs.psk }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed (container lacks NET_ADMIN / wireguard kernel support)"
            exit 0
          fi
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
          IF=""
          for i in $(sudo wg show interfaces); do
            if sudo wg show "$i" peers | grep -qxF "$PUB"; then IF="$i"; fi
          done
          echo "interface: $IF"
          [ -n "$IF" ] || { echo "FAIL: no interface with expected peer"; exit 1; }
          sudo wg show "$IF"
          sudo wg show "$IF" preshared-keys | grep -qF "$PSK" || { echo "FAIL: preshared key not set"; exit 1; }
          ka="$(sudo wg show "$IF" persistent-keepalive | awk '{print $2}')"
          echo "keepalive: $ka"
          [ "$ka" = "25" ] || { echo "FAIL: keepalive expected 25"; exit 1; }
          sudo ip link del "$IF" || true
          echo "PASS"
