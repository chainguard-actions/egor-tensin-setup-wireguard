name: Test basic WireGuard setup
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install wireguard-tools for key generation
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -yq --no-install-recommends wireguard-tools

      - name: Generate WireGuard keys
        id: keygen
        run: |
          PRIVATE_KEY="$(wg genkey)"
          SERVER_PRIVATE="$(wg genkey)"
          SERVER_PUBLIC="$(echo "$SERVER_PRIVATE" | wg pubkey)"
          echo "private_key=$PRIVATE_KEY" >> "$GITHUB_OUTPUT"
          echo "server_public=$SERVER_PUBLIC" >> "$GITHUB_OUTPUT"

      - name: Install command mocks for kernel operations
        run: |
          # Mock 'ip' to handle wireguard-specific operations without kernel module.
          # /usr/local/sbin is first in sudo's secure_path on Ubuntu, so this
          # takes precedence over /sbin/ip when the action runs 'sudo ip ...'.
          sudo tee /usr/local/sbin/ip > /dev/null << 'SCRIPT'
          #!/bin/sh
          # Intercept wireguard-related calls; pass everything else to real ip
          _has_wg=0
          for _a in "$@"; do
            case "$_a" in wireguard) _has_wg=1 ;; esac
          done
          if [ "$_has_wg" = "1" ]; then
            echo "[mock-ip] ip $*" >&2
            exit 0
          fi
          case "$*" in
            "addr add "* | "route replace "* | "link set "*)
              echo "[mock-ip] ip $*" >&2
              exit 0
              ;;
          esac
          exec /sbin/ip "$@"
          SCRIPT
          sudo chmod +x /usr/local/sbin/ip

          # Mock 'wg' to simulate success for wg set operations.
          # Pass through genkey/pubkey/genpsk to the real binary.
          # /usr/local/sbin takes precedence over /usr/bin under sudo.
          sudo tee /usr/local/sbin/wg > /dev/null << 'SCRIPT'
          #!/bin/sh
          case "$1" in
            genkey|pubkey|genpsk)
              exec /usr/bin/wg "$@"
              ;;
          esac
          echo "[mock-wg] wg $*" >&2
          exit 0
          SCRIPT
          sudo chmod +x /usr/local/sbin/wg

          echo "Mocks installed in /usr/local/sbin/"

      - id: action
        uses: .
        with:
          endpoint: "127.0.0.1:51820"
          endpoint_public_key: ${{ steps.keygen.outputs.server_public }}
          ips: "10.0.0.2/32"
          allowed_ips: "10.0.0.0/24"
          private_key: ${{ steps.keygen.outputs.private_key }}

      - name: Assert action completed successfully
        run: |
          echo "PASS: Action completed without error"
          echo "Basic WireGuard setup action ran successfully"
