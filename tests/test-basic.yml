name: Test basic WireGuard setup
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Generate keys
        id: keys
        run: |
          echo "private=$(openssl rand -base64 32)" >> "$GITHUB_OUTPUT"
          echo "public=$(openssl rand -base64 32)" >> "$GITHUB_OUTPUT"
      - id: action
        uses: .
        continue-on-error: true
        with:
          endpoint: 127.0.0.1:51820
          endpoint_public_key: ${{ steps.keys.outputs.public }}
          ips: 10.200.0.2/24
          allowed_ips: 10.200.0.0/24
          private_key: ${{ steps.keys.outputs.private }}
      - name: Assert private key file was cleaned up
        run: |
          if sudo test -e /etc/wireguard/private.key; then
            echo "FAIL: /etc/wireguard/private.key still exists"
            exit 1
          fi
          if sudo test -e /etc/wireguard/preshared.key; then
            echo "FAIL: /etc/wireguard/preshared.key exists although no preshared key given"
            exit 1
          fi
          echo "PASS: key files cleaned up"
      - name: Assert interface configuration
        env:
          OUTCOME: ${{ steps.action.outcome }}
          PUB: ${{ steps.keys.outputs.public }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed (container lacks NET_ADMIN / wireguard kernel support)"
            exit 0
          fi
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
          IF=""
          for i in $(sudo wg show interfaces); do
            if sudo wg show "$i" peers | grep -qxF "$PUB"; then IF="$i"; fi
          done
          echo "interface: $IF"
          if [ -z "$IF" ]; then
            echo "FAIL: no wireguard interface with expected peer"
            sudo wg show || true
            exit 1
          fi
          case "$IF" in wg*) ;; *) echo "FAIL: interface name should start with wg"; exit 1 ;; esac
          sudo wg show "$IF"
          sudo wg show "$IF" endpoints | grep -qF "127.0.0.1:51820" || { echo "FAIL: endpoint"; exit 1; }
          sudo wg show "$IF" allowed-ips | grep -qF "10.200.0.0/24" || { echo "FAIL: allowed-ips"; exit 1; }
          port="$(sudo wg show "$IF" listen-port)"
          echo "port: $port"
          if [ "$port" -lt 51000 ] || [ "$port" -gt 51999 ]; then echo "FAIL: port out of range"; exit 1; fi
          ip -o addr show dev "$IF" | grep -qF "10.200.0.2/24" || { echo "FAIL: address"; exit 1; }
          ip route show dev "$IF" | grep -qF "10.200.0.0/24" || { echo "FAIL: route"; exit 1; }
          sudo wg show "$IF" preshared-keys | grep -q "(none)" || { echo "FAIL: unexpected preshared key"; exit 1; }
          sudo ip link del "$IF" || true
          echo "PASS"
