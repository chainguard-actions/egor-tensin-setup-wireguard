name: Test WireGuard setup with preshared key
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install wireguard-tools and prepare mocks
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -yq --no-install-recommends wireguard-tools openssl

          # Generate WireGuard keys
          PRIVATE_KEY="$(wg genkey)"
          PEER_PRIVATE="$(wg genkey)"
          PEER_PUBLIC="$(echo "$PEER_PRIVATE" | wg pubkey)"
          PRESHARED_KEY="$(wg genpsk)"

          echo "PRIVATE_KEY=$PRIVATE_KEY" >> "$GITHUB_ENV"
          echo "PEER_PUBLIC=$PEER_PUBLIC" >> "$GITHUB_ENV"
          echo "PRESHARED_KEY=$PRESHARED_KEY" >> "$GITHUB_ENV"

          # Initialize tracking files
          : > /tmp/wg_set_calls.txt
          : > /tmp/wg_addrs.txt
          : > /tmp/wg_routes.txt
          : > /tmp/wg_up.txt

          # Create mock directory
          mkdir -p /tmp/mock-bin

          # Mock sudo: intercepts WireGuard-specific commands, passes others through
          cat > /tmp/mock-bin/sudo << 'MOCKEOF'
          #!/bin/sh
          case "$*" in
            "ip link add dev "*)
              echo "$5" > /tmp/wg_ifname.txt
              echo "[mock] ip link add dev $5 type wireguard" >&2
              exit 0
              ;;
            "ip addr add "*)
              echo "$*" >> /tmp/wg_addrs.txt
              echo "[mock] ip addr add: $*" >&2
              exit 0
              ;;
            "wg set "*)
              echo "$*" >> /tmp/wg_set_calls.txt
              echo "[mock] wg set: $*" >&2
              exit 0
              ;;
            "ip link set "*)
              echo "UP" >> /tmp/wg_up.txt
              echo "[mock] ip link set up" >&2
              exit 0
              ;;
            "ip route replace "*)
              echo "$*" >> /tmp/wg_routes.txt
              echo "[mock] ip route replace: $*" >&2
              exit 0
              ;;
            "DEBIAN_FRONTEND="*" apt-get "*)
              exec /usr/bin/sudo "$@"
              ;;
            "apt-get "*)
              exec /usr/bin/sudo "$@"
              ;;
            *)
              exec /usr/bin/sudo "$@"
              ;;
          esac
          MOCKEOF
          chmod +x /tmp/mock-bin/sudo

          echo "Mock setup complete"

      - name: Set up WireGuard (with preshared key)
        id: action
        uses: .
        env:
          PATH: /tmp/mock-bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
        with:
          endpoint: "127.0.0.1:51820"
          endpoint_public_key: ${{ env.PEER_PUBLIC }}
          ips: "10.201.0.1/24"
          allowed_ips: "10.201.0.0/24"
          private_key: ${{ env.PRIVATE_KEY }}
          preshared_key: ${{ env.PRESHARED_KEY }}

      - name: Assert wg set was called with preshared-key flag
        run: |
          echo "=== wg set calls ==="
          cat /tmp/wg_set_calls.txt
          # The action should call wg set with preshared-key when preshared_key is provided
          if grep -q 'preshared-key' /tmp/wg_set_calls.txt; then
            echo "PASS: wg set was called with preshared-key"
          else
            echo "FAIL: wg set was not called with preshared-key"
            exit 1
          fi

      - name: Assert interface was brought up
        run: |
          echo "=== ip link set up calls ==="
          cat /tmp/wg_up.txt
          if grep -q 'UP' /tmp/wg_up.txt; then
            echo "PASS: Interface was brought up"
          else
            echo "FAIL: Interface was not brought up"
            exit 1
          fi

      - name: Assert IP address was configured
        run: |
          echo "=== ip addr add calls ==="
          cat /tmp/wg_addrs.txt
          if grep -q '10.201.0.1' /tmp/wg_addrs.txt; then
            echo "PASS: IP address 10.201.0.1 was configured"
          else
            echo "FAIL: IP address 10.201.0.1 was not configured"
            exit 1
          fi

      - name: Assert private key temp file was cleaned up
        run: |
          # The action uses trap wg_tools_cleanup EXIT to remove temp key files
          if [ ! -f /tmp/private.key ]; then
            echo "PASS: Private key temp file was cleaned up"
          else
            echo "FAIL: Private key temp file /tmp/private.key still exists"
            exit 1
          fi

      - name: Assert preshared key temp file was cleaned up
        run: |
          if [ ! -f /tmp/preshared.key ]; then
            echo "PASS: Preshared key temp file was cleaned up"
          else
            echo "FAIL: Preshared key temp file /tmp/preshared.key still exists"
            exit 1
          fi
