name: Test WireGuard setup with multiple IPs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install wireguard-tools for key generation
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -yq --no-install-recommends wireguard-tools

      - name: Generate WireGuard keys
        id: keygen
        run: |
          PRIVATE_KEY="$(wg genkey)"
          SERVER_PRIVATE="$(wg genkey)"
          SERVER_PUBLIC="$(echo "$SERVER_PRIVATE" | wg pubkey)"
          echo "private_key=$PRIVATE_KEY" >> "$GITHUB_OUTPUT"
          echo "server_public=$SERVER_PUBLIC" >> "$GITHUB_OUTPUT"

      - name: Install command mocks for kernel operations
        run: |
          # Mock 'ip' to handle wireguard-specific operations without kernel module.
          # /usr/local/sbin is first in sudo's secure_path on Ubuntu.
          sudo tee /usr/local/sbin/ip > /dev/null << 'SCRIPT'
          #!/bin/sh
          # Intercept wireguard-related calls; pass everything else to real ip
          _has_wg=0
          for _a in "$@"; do
            case "$_a" in wireguard) _has_wg=1 ;; esac
          done
          if [ "$_has_wg" = "1" ]; then
            echo "[mock-ip] ip $*" >&2
            exit 0
          fi
          case "$*" in
            "addr add "* | "route replace "* | "link set "*)
              echo "[mock-ip] ip $*" >&2
              exit 0
              ;;
          esac
          exec /sbin/ip "$@"
          SCRIPT
          sudo chmod +x /usr/local/sbin/ip

          # Mock 'wg' to simulate success and log calls for verification.
          # Pass through genkey/pubkey/genpsk to the real binary.
          sudo tee /usr/local/sbin/wg > /dev/null << 'SCRIPT'
          #!/bin/sh
          case "$1" in
            genkey|pubkey|genpsk)
              exec /usr/bin/wg "$@"
              ;;
          esac
          echo "[mock-wg] wg $*" >&2
          echo "wg $*" >> /tmp/wg-calls.log
          exit 0
          SCRIPT
          sudo chmod +x /usr/local/sbin/wg

          # Initialize log file writable by root (mock runs under sudo)
          sudo touch /tmp/wg-calls.log
          sudo chmod 666 /tmp/wg-calls.log

          echo "Mocks installed in /usr/local/sbin/"

      - id: action
        uses: .
        with:
          endpoint: "127.0.0.1:51820"
          endpoint_public_key: ${{ steps.keygen.outputs.server_public }}
          ips: "10.0.0.2/32,10.0.0.3/32"
          allowed_ips: "10.0.0.0/24,192.168.100.0/24"
          private_key: ${{ steps.keygen.outputs.private_key }}

      - name: Assert action called wg with correct endpoint
        run: |
          echo "=== wg mock call log ==="
          cat /tmp/wg-calls.log || true

          if grep -q "127.0.0.1:51820" /tmp/wg-calls.log; then
            echo "PASS: wg set was called with the correct endpoint"
          else
            echo "FAIL: wg set was not called with endpoint 127.0.0.1:51820"
            exit 1
          fi

      - name: Assert action called wg with allowed-ips for both networks
        run: |
          if grep -q "allowed-ips" /tmp/wg-calls.log; then
            echo "PASS: wg set was called with allowed-ips"
          else
            echo "FAIL: wg set was not called with allowed-ips"
            exit 1
          fi

          # Verify both allowed IP networks are present in the wg call
          if grep -q "10.0.0.0/24" /tmp/wg-calls.log; then
            echo "PASS: 10.0.0.0/24 found in wg call"
          else
            echo "FAIL: 10.0.0.0/24 not found in wg call"
            cat /tmp/wg-calls.log
            exit 1
          fi

          if grep -q "192.168.100.0/24" /tmp/wg-calls.log; then
            echo "PASS: 192.168.100.0/24 found in wg call"
          else
            echo "FAIL: 192.168.100.0/24 not found in wg call"
            cat /tmp/wg-calls.log
            exit 1
          fi

          echo "PASS: Action completed successfully with multiple IPs and allowed_ips"
