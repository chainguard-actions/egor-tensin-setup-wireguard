name: Test WireGuard with multiple IPs and allowed IPs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Generate keys
        id: keys
        run: |
          echo "private=$(openssl rand -base64 32)" >> "$GITHUB_OUTPUT"
          echo "public=$(openssl rand -base64 32)" >> "$GITHUB_OUTPUT"
      - id: action
        uses: .
        continue-on-error: true
        with:
          endpoint: 127.0.0.1:51822
          endpoint_public_key: ${{ steps.keys.outputs.public }}
          ips: 10.221.0.2/24,10.222.0.2/24
          allowed_ips: 10.221.0.0/24,10.222.0.0/24
          private_key: ${{ steps.keys.outputs.private }}
      - name: Assert private key file was cleaned up
        run: |
          if sudo test -e /etc/wireguard/private.key; then
            echo "FAIL: /etc/wireguard/private.key still exists"
            exit 1
          fi
          echo "PASS"
      - name: Assert interface configuration
        env:
          OUTCOME: ${{ steps.action.outcome }}
          PUB: ${{ steps.keys.outputs.public }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed (container lacks NET_ADMIN / wireguard kernel support)"
            exit 0
          fi
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
          IF=""
          for i in $(sudo wg show interfaces); do
            if sudo wg show "$i" peers | grep -qxF "$PUB"; then IF="$i"; fi
          done
          echo "interface: $IF"
          [ -n "$IF" ] || { echo "FAIL: no interface with expected peer"; exit 1; }
          ip -o addr show dev "$IF"
          ip route show dev "$IF"
          for a in 10.221.0.2/24 10.222.0.2/24; do
            ip -o addr show dev "$IF" | grep -qF "$a" || { echo "FAIL: missing address $a"; exit 1; }
          done
          for n in 10.221.0.0/24 10.222.0.0/24; do
            sudo wg show "$IF" allowed-ips | grep -qF "$n" || { echo "FAIL: missing allowed-ip $n"; exit 1; }
            ip route show dev "$IF" | grep -qF "$n" || { echo "FAIL: missing route $n"; exit 1; }
          done
          sudo ip link del "$IF" || true
          echo "PASS"
