name: Test multiple IPs (comma-separated list)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install WireGuard kernel module (best-effort)
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -yq --no-install-recommends wireguard wireguard-tools 2>/dev/null || true
          sudo modprobe wireguard 2>/dev/null || true

      - id: action
        uses: .
        continue-on-error: true
        with:
          # Valid-looking WireGuard keys (base64-encoded 32-byte values)
          endpoint: "192.0.2.1:51820"
          endpoint_public_key: "wTDiMHBMGqMhy3Q0bBqBmLqFLMDsGGmFHVCQhFmMnXE="
          # Multiple IPs as comma-separated list
          ips: "10.0.0.2/32,10.0.0.3/32"
          # Multiple allowed_ips as comma-separated list
          allowed_ips: "10.0.0.0/24,192.168.1.0/24"
          private_key: "YHpTSMB7QLBMK3i3jlTgFhBt8nzTGkMT3oBqJJJJJE="

      - name: Assert action ran with multiple IPs (succeeded or failed gracefully)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: WireGuard interface set up successfully with multiple IPs"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (WireGuard kernel module likely unavailable in container)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
