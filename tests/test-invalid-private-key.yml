name: Test WireGuard with invalid private key fails
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Generate public key
        id: keys
        run: echo "public=$(openssl rand -base64 32)" >> "$GITHUB_OUTPUT"
      - id: action
        uses: .
        continue-on-error: true
        with:
          endpoint: 127.0.0.1:51823
          endpoint_public_key: ${{ steps.keys.outputs.public }}
          ips: 10.230.0.2/24
          allowed_ips: 10.230.0.0/24
          private_key: not-a-valid-key
      - name: Assert action failed
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure with invalid private key"
            exit 1
          fi
          echo "PASS"
      - name: Assert private key file was cleaned up on failure
        run: |
          if sudo test -e /etc/wireguard/private.key; then
            echo "FAIL: /etc/wireguard/private.key still exists after failure"
            exit 1
          fi
          echo "PASS"
